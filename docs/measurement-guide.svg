<svg xmlns="http://www.w3.org/2000/svg" width="880" height="700" viewBox="0 0 880 700"><rect width="880" height="700" fill="#f5f7fb"/><g font-family="Segoe UI,Arial" fill="#1f3a5f"><text x="50" y="55" font-size="26" font-weight="bold">LP2 calibration: six caliper spans</text><text x="50" y="88" font-size="17">Measure the baseline end to end. Every intended span equals the selected pattern size.</text><g stroke="#1f3a5f" stroke-width="3"><path d="M190 160H590 M190 360H590 M190 560H590 M190 160V560 M390 160V560 M590 160V560"/></g><g font-size="20"><text x="635" y="168">Wtop</text><text x="635" y="368">Wmiddle</text><text x="635" y="568">Wbottom</text><text x="160" y="610">Hleft</text><text x="350" y="610">Hmiddle</text><text x="560" y="610">Hright</text></g><text x="50" y="660" font-size="17">Enter baseline measurements, apply the profile, then engrave a check on fresh material.</text></g></svg>